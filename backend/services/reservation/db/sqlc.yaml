version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "query/reservation_query.sql"
      - "query/reservation_penalty_query.sql"
      - "query/supplier_terms_query.sql"
      - "query/outbox_query.sql"
    schema: "./migrations"
    gen:
      go:
        package: "db"
        out: "."
        sql_package: "pgx/v5"
        emit_interface: true
        emit_pointers_for_null_types: true

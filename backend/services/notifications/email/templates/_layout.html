{{define "layout"}}
<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Booking Travel</title>
    <style>
      body { margin: 0; padding: 0; background-color: #f4f4fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #0f0043; direction: rtl; }
      .wrapper { width: 100%; padding: 40px 16px; box-sizing: border-box; }
      .card { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0px 4px 24px 0px rgba(0, 14, 247, 0.08); direction: rtl; text-align: right; border: 1px solid #080026;}
      .header { background: linear-gradient(135deg, #0f0043 0%, #1b4f9b 100%); padding: 40px 32px; text-align: center; color: #ffffff; }
      .brand { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #f5821f; margin-bottom: 12px; }
      .header h1 { margin: 0; font-size: 28px; font-weight: 900; line-height: 1.3; letter-spacing: -0.01em; }
      .header p { margin: 8px 0 0; color: rgba(255, 255, 255, 0.75); font-size: 14px; line-height: 1.7; font-family: monospace; letter-spacing: 0.05em; }
      .body { padding: 36px 32px; direction: rtl; text-align: right; }
      .greeting { font-size: 18px; font-weight: 700; color: #0f0043; margin: 0 0 16px; direction: rtl; text-align: right; unicode-bidi: embed; }
      .text { font-size: 16px; line-height: 1.7; color: #374151; margin: 0 0 20px; direction: rtl; text-align: right; unicode-bidi: embed; }
      .price-highlight { font-size: 20px; font-weight: 700; color: #1b4f9b; background-color: #f4f4fa; padding: 16px; border-radius: 8px; text-align: center; margin: 0 0 24px; }
      .button-wrap { margin: 0 0 24px; text-align: center; }
      .button { display: inline-block; padding: 14px 28px; background: linear-gradient(135deg, #f5821f 0%, #ff9b4a 100%); color: #ffffff !important; text-decoration: none; font-size: 16px; font-weight: 700; border-radius: 999px; }
      .link-box { background-color: #f4f4fa; border-radius: 12px; padding: 16px; margin: 0 0 20px; direction: ltr; text-align: left; }
      .link-box a { color: #1b4f9b; word-break: break-all; text-decoration: none; }
      .notice { font-size: 15px; line-height: 1.7; color: #374151; background-color: #fef9ec; border-right: 4px solid #f5821f; border-radius: 4px; padding: 14px 16px; margin: 0 0 20px; direction: rtl; text-align: right; unicode-bidi: embed; }
      .bank-details { background: linear-gradient(180deg, #f8fbff 0%, #f4f4fa 100%); border: 1px solid #dbe7f5; border-radius: 14px; padding: 20px; margin: 0 0 24px; }
      .bank-details-title { margin: 0 0 10px; font-size: 18px; font-weight: 800; color: #0f0043; }
      .bank-details-text { margin: 0 0 16px; font-size: 15px; line-height: 1.7; color: #374151; }
      .bank-details-table { width: 100%; border-collapse: collapse; margin: 0 0 14px; }
      .bank-details-table td { padding: 10px 0; border-bottom: 1px solid #dbe7f5; font-size: 15px; color: #374151; }
      .bank-details-table tr:last-child td { border-bottom: none; }
      .bank-details-label { font-weight: 700; color: #0f0043; width: 38%; }
      .bank-details-value { text-align: left; direction: ltr; font-weight: 700; color: #1b4f9b; }
      .bank-details-note { margin: 0; font-size: 14px; line-height: 1.7; color: #4b5563; }
      .checklist-title { font-size: 22px; font-weight: 800; }
      .checklist { list-style: none; padding: 0; margin: 0 0 20px; }
      .checklist li { font-size: 18px; line-height: 1.8; font-weight: 800; color: #374151; padding-right: 24px; position: relative; direction: rtl; text-align: right; }
      .checklist li::before { content: "✓"; position: absolute; right: 0; color: #1b4f9b; font-weight: 900; }
      .divider { border: none; border-top: 1px solid #e2e4e9; margin: 28px 0 20px; }
      .signature { font-size: 15px; color: #374151; line-height: 1.6; }
      .signature strong { color: #0f0043; }
      .footer { background-color: #f4f4fa; border-top: 1px solid #e2e4e9; padding: 20px 32px; text-align: center; font-size: 12px; color: #676767; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <div class="header">
          <div class="brand">
            <img
              src="https://dev.aibookingtravel.com/_next/image?url=%2Flogo-dark.png&w=256&q=75&dpl=dpl_DaDyh9jUn2G8D1hxWL2S7tNEQPjG"
              alt="AI Booking Travel"
              style="height: 48px; width: auto; display: block; margin: 0 auto"
            />
          </div>
          {{block "header_content" .}}{{end}}
        </div>
        <div class="body">
          {{template "content" .}}
        </div>

        <div class="footer">
          הודעה זו נשלחה באופן אוטומטי ממערכת AI Booking Travel.<br />
          אין להשיב להודעה זו.
        </div>
      </div>
    </div>
  </body>
</html>
{{end}}
